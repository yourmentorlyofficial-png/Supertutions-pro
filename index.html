<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#ff914d">

<title>SuperTutions</title>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      145deg,
      #fff7f0,
      #f4f8ff
    );

  min-height: 100vh;

  overflow: hidden;
}


/* =========================
   APP
========================= */

.app {

  min-height: 100vh;

  padding: 30px 22px;

  position: relative;
}


.logo-title {

  text-align: center;

  font-size: 32px;

  font-weight: 800;

  margin-top: 35px;

  color: #202020;
}


/* =========================
   OWL
========================= */

#owl {

  position: fixed;

  width: 170px;
  height: 170px;

  object-fit: contain;

  left: -200px;

  top: 35%;

  z-index: 100;

  pointer-events: none;

  opacity: 1;

  transition:

    left 1.2s
      cubic-bezier(.22,1,.36,1),

    right 1.2s
      cubic-bezier(.22,1,.36,1),

    top 1.2s
      cubic-bezier(.22,1,.36,1),

    transform 1.2s
      cubic-bezier(.22,1,.36,1),

    opacity .35s ease;
}


/* =========================
   FLOAT
========================= */

.owl-float {

  animation:
    owlFloat 1.5s ease-in-out infinite;
}


@keyframes owlFloat {

  0%,100% {
    margin-top: 0;
  }

  50% {
    margin-top: -10px;
  }
}


/* =========================
   CONFUSED
========================= */

.confused-motion {

  animation:
    confusedMotion .75s
    ease-in-out infinite
    alternate;
}


@keyframes confusedMotion {

  from {

    transform:
      translateX(-50%)
      rotate(-6deg)
      translateY(0);

  }

  to {

    transform:
      translateX(-50%)
      rotate(6deg)
      translateY(-7px);

  }

}


/* =========================
   FLYING
========================= */

.flying {

  animation:
    flying .5s
    ease-in-out infinite
    alternate;
}


@keyframes flying {

  from {
    margin-top: -5px;
  }

  to {
    margin-top: 7px;
  }

}


/* =========================
   BIG ZOOM AFTER LOGIN
========================= */

.login-zoom {

  animation:
    loginZoom .65s
    cubic-bezier(.22,1,.36,1);
}


@keyframes loginZoom {

  0% {

    transform:
      translateX(-50%)
      scale(.72);

  }

  45% {

    transform:
      translateX(-50%)
      scale(1.45);

  }

  100% {

    transform:
      translateX(-50%)
      scale(.9);

  }

}


/* =========================
   SPEECH
========================= */

#speech {

  position: fixed;

  left: 50%;

  top: 18%;

  transform:
    translateX(-50%)
    scale(.75);

  background: white;

  padding: 16px 22px;

  border-radius: 22px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.14);

  font-size: 18px;

  font-weight: 700;

  opacity: 0;

  transition:

    opacity .35s ease,

    transform .35s
    cubic-bezier(.22,1,.36,1);

  z-index: 150;

  text-align: center;

  max-width: 290px;

  pointer-events: none;
}


#speech.show {

  opacity: 1;

  transform:
    translateX(-50%)
    scale(1);
}


/* =========================
   LOGIN CARD
========================= */

#loginCard {

  position: fixed;

  left: 50%;

  bottom: 8%;

  transform:
    translateX(-50%)
    translateY(50px)
    scale(.96);

  width:
    calc(100% - 40px);

  max-width: 390px;

  background:
    rgba(255,255,255,.86);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  padding: 28px;

  border-radius: 30px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.12);

  opacity: 0;

  transition:

    opacity .6s ease,

    transform .7s
    cubic-bezier(.22,1,.36,1);

  z-index: 40;
}


#loginCard.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);
}


#loginCard h2 {

  margin-top: 0;

  font-size: 28px;
}


#loginCard p {

  color: #666;
}


/* =========================
   BUTTON
========================= */

button {

  width: 100%;

  border: none;

  padding: 16px;

  border-radius: 18px;

  font-size: 17px;

  font-weight: 700;

  margin-top: 10px;

  cursor: pointer;

  background: #ff914d;

  color: white;

  box-shadow:
    0 8px 20px
    rgba(255,145,77,.30);

  transition:
    transform .15s ease;
}


button:active {

  transform:
    scale(.95);
}


.signup {

  background: #f1f1f1;

  color: #333;
}


/* =========================
   OWL PERCHED ABOVE CARD
========================= */

#owl.perched {

  width: 125px;

  height: 125px;

  z-index: 80;

  animation:
    perchFloat 2s
    ease-in-out infinite;
}


@keyframes perchFloat {

  0%,100% {

    margin-top: 0;

  }

  50% {

    margin-top: -5px;

  }

}


/* =========================
   DOUBT BALL
========================= */

#doubtBall {

  position: fixed;

  right: 18px;

  bottom: 20px;

  width: 64px;

  height: 64px;

  border-radius: 50%;

  background: #ff914d;

  box-shadow:
    0 10px 30px
    rgba(255,145,77,.4);

  display: flex;

  align-items: center;

  justify-content: center;

  opacity: 0;

  transform: scale(.2);

  transition:

    opacity .35s ease,

    transform .6s
    cubic-bezier(.22,1,.36,1);

  z-index: 200;
}


#doubtBall.show {

  opacity: 1;

  transform: scale(1);
}


#doubtBall img {

  width: 48px;

  height: 48px;

  border-radius: 50%;

  object-fit: cover;
}


#doubtBall.pop {

  animation:
    ballPop .7s
    cubic-bezier(.22,1,.36,1);
}


@keyframes ballPop {

  0% {

    transform:
      scale(.2)
      rotate(-15deg);

  }

  60% {

    transform:
      scale(1.15)
      rotate(5deg);

  }

  100% {

    transform:
      scale(1);

  }

}


/* =========================
   MOBILE
========================= */

@media (max-height:700px) {

  #owl {

    width: 145px;
    height: 145px;

  }

  #loginCard {

    bottom: 5%;

  }

}

</style>

</head>


<body>


<div class="app">

  <div class="logo-title">
    SuperTutions
  </div>

</div>


<!-- OWL -->

<img
  id="owl"
  src="happy-1.png"
  alt="SuperTutions Owl"
>


<!-- SPEECH -->

<div id="speech"></div>


<!-- LOGIN CARD -->

<div id="loginCard">

  <h2>
    Welcome! 👋
  </h2>

  <p>
    Sign in to continue your learning journey.
  </p>

  <button onclick="login()">
    Login
  </button>

  <button
    class="signup"
    onclick="login()">

    Sign Up

  </button>

</div>


<!-- DOUBT BALL -->

<div id="doubtBall">

  <img
    src="icon-512.png"
    alt="Owl"
  >

</div>


<script>


/* =========================
   ELEMENTS
========================= */

const owl =
  document.getElementById("owl");

const speech =
  document.getElementById("speech");

const loginCard =
  document.getElementById("loginCard");

const doubtBall =
  document.getElementById("doubtBall");


/* =========================
   YOUR OWL FILES
========================= */

const HAPPY =
  "happy-1.png";

const CONFUSED =
  "confused.png";

const HAPPY2 =
  "happy-2.png";


/* =========================
   LOGIN MEMORY
========================= */

const loggedIn =
  localStorage.getItem(
    "supertutions_logged_in"
  ) === "true";


/* =========================
   SPEECH
========================= */

function say(text) {

  speech.innerText = text;

  speech.classList.remove("show");

  setTimeout(() => {

    speech.classList.add("show");

  }, 40);
}


function hideSpeech() {

  speech.classList.remove("show");

}


/* ==================================================
   FIRST TIME USER
================================================== */

function firstTimeAnimation() {


  /* -------------------------
     OWL STARTS OFFSCREEN
  ------------------------- */

  owl.src = HAPPY;

  owl.style.left = "-200px";

  owl.style.right = "auto";

  owl.style.top = "35%";

  owl.style.opacity = "1";


  /* -------------------------
     ENTER SCREEN
  ------------------------- */

  setTimeout(() => {

    owl.style.left = "50%";

    owl.style.transform =
      "translateX(-50%)";

    owl.classList.add(
      "owl-float"
    );

  }, 300);


  /* -------------------------
     CONFUSED
  ------------------------- */

  setTimeout(() => {

    owl.classList.remove(
      "owl-float"
    );

    owl.src = CONFUSED;

    owl.classList.add(
      "confused-motion"
    );

    say("🤔");

  }, 1600);


  /* -------------------------
     WELCOME
  ------------------------- */

  setTimeout(() => {

    owl.classList.remove(
      "confused-motion"
    );

    owl.src = HAPPY2;

    say(
      "Welcome to SuperTutions! 🦉"
    );

  }, 2900);


  /* -------------------------
     PREPARE TO FLY
  ------------------------- */

  setTimeout(() => {

    hideSpeech();

    owl.classList.add(
      "flying"
    );

  }, 4500);


  /* -------------------------
     FLY TO LOGIN CARD
  ------------------------- */

  setTimeout(() => {

    owl.style.top =
      "calc(92% - 185px)";

    owl.style.transform =
      "translateX(-50%) scale(.78)";

  }, 4800);


  /* -------------------------
     SHOW LOGIN CARD
  ------------------------- */

  setTimeout(() => {

    loginCard.classList.add(
      "show"
    );

  }, 5400);


  /* -------------------------
     PERCH
     
     IMPORTANT:
     The owl now STAYS HERE.
     
     It does NOT become the
     doubt ball.
  ------------------------- */

  setTimeout(() => {

    owl.classList.remove(
      "flying"
    );

    owl.classList.add(
      "perched"
    );

    owl.style.top =
      "calc(92% - 250px)";

    owl.style.transform =
      "translateX(-50%) scale(.72)";

  }, 6200);

}


/* ==================================================
   USER LOGGED IN ALREADY
================================================== */

function returningAnimation() {


  /* -------------------------
     ENTER
  ------------------------- */

  owl.src = HAPPY2;

  owl.style.left = "-200px";

  owl.style.right = "auto";

  owl.style.top = "35%";

  owl.style.opacity = "1";


  setTimeout(() => {

    owl.style.left = "50%";

    owl.style.transform =
      "translateX(-50%)";

    owl.classList.add(
      "owl-float"
    );

  }, 300);


  /* -------------------------
     WELCOME BACK
  ------------------------- */

  setTimeout(() => {

    owl.classList.remove(
      "owl-float"
    );

    say(
      "Welcome back! 🦉"
    );

  }, 1700);


  /* -------------------------
     FLY TO CORNER
  ------------------------- */

  setTimeout(() => {

    hideSpeech();

    owl.classList.add(
      "flying"
    );

    owl.style.left = "auto";

    owl.style.right = "18px";

    owl.style.top =
      "calc(100% - 120px)";

    owl.style.transform =
      "scale(.42)";

  }, 3200);


  /* -------------------------
     BECOME DOUBT BALL
  ------------------------- */

  setTimeout(() => {

    owl.style.opacity = "0";

    owl.classList.remove(
      "flying"
    );

    doubtBall.classList.add(
      "show"
    );

    doubtBall.classList.add(
      "pop"
    );

  }, 4300);

}


/* ==================================================
   AFTER REAL LOGIN
================================================== */

function login() {


  /*
    Remember that this user
    has now logged in.
  */

  localStorage.setItem(
    "supertutions_logged_in",
    "true"
  );


  /*
    Hide login card
  */

  loginCard.classList.remove(
    "show"
  );

  hideSpeech();


  /*
    Remove perched animation
  */

  owl.classList.remove(
    "perched"
  );


  /*
    THIS IS THE IMPORTANT PART:
    
    The owl suddenly looks at
    the user and ZOOMS toward
    the screen.
  */

  owl.style.top = "45%";

  owl.style.left = "50%";

  owl.style.right = "auto";

  owl.style.transform =
    "translateX(-50%) scale(1)";


  owl.classList.add(
    "login-zoom"
  );


  /* -------------------------
     THEN FLY TO CORNER
  ------------------------- */

  setTimeout(() => {

    owl.classList.remove(
      "login-zoom"
    );

    owl.classList.add(
      "flying"
    );

    owl.style.left = "auto";

    owl.style.right = "18px";

    owl.style.top =
      "calc(100% - 120px)";

    owl.style.transform =
      "scale(.42)";

  }, 750);


  /* -------------------------
     BECOME DOUBT BALL
  ------------------------- */

  setTimeout(() => {

    owl.style.opacity = "0";

    owl.classList.remove(
      "flying"
    );

    doubtBall.classList.add(
      "show"
    );

    doubtBall.classList.add(
      "pop"
    );

  }, 1700);

}


/* ==================================================
   START
================================================== */

if (loggedIn) {

  /*
    Already logged in:
    Welcome back → circle
  */

  returningAnimation();

} else {

  /*
    New user:
    Welcome → login → WAIT
  */

  firstTimeAnimation();

}

</script>

</body>

</html>
