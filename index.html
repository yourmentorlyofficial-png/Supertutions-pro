<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#ff914d">

<title>SuperTutions</title>

<style>

/* =========================
   BASIC
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {

  background:
    radial-gradient(
      circle at top,
      #fffaf4,
      #f3f7ff
    );

  overflow-x: hidden;
  min-height: 100vh;
}


/* =========================
   APP
========================= */

.app {

  min-height: 100vh;

  padding:
    30px 22px 120px;

  position: relative;

}


/* =========================
   TITLE
========================= */

.logo-title {

  text-align: center;

  font-size: 32px;

  font-weight: 900;

  margin-top: 25px;

  color: #202020;

}


/* =========================
   OWL
========================= */

#owl {

  position: fixed;

  width: 155px;
  height: 155px;

  object-fit: contain;

  left: 50%;

  /*
     Starts above the screen.
  */

  top: -190px;

  transform:
    translateX(-50%)
    scale(.85);

  opacity: 0;

  z-index: 100;

  pointer-events: none;

  /*
     Smooth Duolingo-ish movement.
  */

  transition:

    top 1.1s
      cubic-bezier(.16,1,.3,1),

    left 1.1s
      cubic-bezier(.16,1,.3,1),

    right 1.1s
      cubic-bezier(.16,1,.3,1),

    transform .8s
      cubic-bezier(.16,1,.3,1),

    opacity .35s ease;

}


/* =========================
   OWL FLOAT
========================= */

.owl-float {

  animation:
    float 1.8s ease-in-out infinite;

}


@keyframes float {

  0% {
    margin-top: 0;
  }

  50% {
    margin-top: -9px;
  }

  100% {
    margin-top: 0;
  }

}


/* =========================
   CONFUSED ANIMATION
========================= */

.confused {

  animation:
    confused 0.7s
    ease-in-out
    infinite alternate;

}


@keyframes confused {

  0% {

    transform:
      translateX(-50%)
      rotate(-6deg)
      scale(.85);

  }

  100% {

    transform:
      translateX(-50%)
      rotate(6deg)
      translateY(-7px)
      scale(.85);

  }

}


/* =========================
   SPEECH BUBBLE
========================= */

#speech {

  position: fixed;

  left: 50%;

  top: 20%;

  transform:
    translateX(-50%)
    translateY(10px)
    scale(.8);

  opacity: 0;

  background: white;

  padding:
    17px 22px;

  border-radius: 24px;

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.13);

  font-size: 18px;

  font-weight: 800;

  text-align: center;

  max-width: 300px;

  z-index: 120;

  transition:

    opacity .3s ease,

    transform .4s
      cubic-bezier(.16,1,.3,1);

}


#speech.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);

}


/* =========================
   LOGIN CARD
========================= */

#loginCard {

  position: fixed;

  left: 50%;

  bottom: 7%;

  width:
    calc(100% - 40px);

  max-width: 390px;

  transform:
    translateX(-50%)
    translateY(60px);

  background:
    rgba(255,255,255,.82);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  padding: 28px;

  border-radius: 30px;

  box-shadow:
    0 22px 55px
    rgba(0,0,0,.13);

  opacity: 0;

  z-index: 40;

  transition:

    opacity .6s ease,

    transform .7s
      cubic-bezier(.16,1,.3,1);

}


#loginCard.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}


#loginCard h2 {

  margin:
    0 0 8px;

  font-size: 28px;

}


#loginCard p {

  margin-top: 0;

  color: #666;

  line-height: 1.5;

}


/* =========================
   BUTTONS
========================= */

button {

  width: 100%;

  border: none;

  padding: 16px;

  border-radius: 18px;

  font-size: 17px;

  font-weight: 800;

  margin-top: 10px;

  cursor: pointer;

  background:
    #ff914d;

  color: white;

  box-shadow:
    0 9px 22px
    rgba(255,145,77,.30);

  transition:

    transform .15s ease,

    box-shadow .15s ease;

}


button:active {

  transform:
    scale(.94);

  box-shadow:
    none;

}


.signup {

  background:
    #eeeeee;

  color:
    #333;

}


/* =========================
   OWL SITTING ABOVE CARD
========================= */

.owl-on-card {

  top: auto !important;

  bottom:
    calc(7% + 230px);

  left: 50% !important;

  right: auto !important;

  transform:
    translateX(-50%)
    scale(.70) !important;

}


/* =========================
   OWL SCREEN ZOOM
========================= */

.owl-zoom {

  top: 50% !important;

  left: 50% !important;

  right: auto !important;

  transform:
    translate(-50%, -50%)
    scale(2.8) !important;

  opacity: 1;

}


/* =========================
   DOUBT BALL
========================= */

#doubtBall {

  position: fixed;

  right: 18px;

  bottom: 20px;

  width: 64px;

  height: 64px;

  border-radius: 50%;

  background:
    #ff914d;

  display: flex;

  align-items: center;

  justify-content: center;

  box-shadow:
    0 10px 30px
    rgba(255,145,77,.40);

  opacity: 0;

  transform:
    scale(.2)
    rotate(-20deg);

  z-index: 200;

  transition:

    opacity .45s ease,

    transform .6s
      cubic-bezier(.16,1,.3,1);

}


#doubtBall.show {

  opacity: 1;

  transform:
    scale(1)
    rotate(0deg);

}


#doubtBall img {

  width: 48px;

  height: 48px;

  object-fit: cover;

  border-radius: 50%;

}


/* =========================
   DOUBT BALL PULSE
========================= */

#doubtBall.pulse {

  animation:
    ballPulse 1s ease;

}


@keyframes ballPulse {

  0% {
    transform: scale(.8);
  }

  45% {
    transform: scale(1.15);
  }

  70% {
    transform: scale(.94);
  }

  100% {
    transform: scale(1);
  }

}


/* =========================
   SCREEN FLASH
========================= */

#flash {

  position: fixed;

  inset: 0;

  background:
    white;

  opacity: 0;

  pointer-events: none;

  z-index: 150;

}


#flash.active {

  animation:
    flash .45s ease;

}


@keyframes flash {

  0% {
    opacity: 0;
  }

  45% {
    opacity: .18;
  }

  100% {
    opacity: 0;
  }

}


/* =========================
   MOBILE
========================= */

@media (max-height: 700px) {

  #owl {

    width: 135px;
    height: 135px;

  }

  .owl-on-card {

    bottom:
      calc(7% + 215px);

  }

}

</style>
</head>


<body>


<!-- =========================
     APP
========================= -->

<div class="app">

  <div class="logo-title">
    SuperTutions
  </div>

</div>


<!-- =========================
     OWL
========================= -->

<img
  id="owl"
  src="lv_0_20260628102435.png"
  alt="SuperTutions Owl"
>


<!-- =========================
     SPEECH
========================= -->

<div id="speech"></div>


<!-- =========================
     LOGIN CARD
========================= -->

<div id="loginCard">

  <h2>
    Welcome! 👋
  </h2>

  <p>
    Sign in to continue your
    learning journey.
  </p>

  <button onclick="login()">
    Login
  </button>

  <button
    class="signup"
    onclick="login()">

    Sign Up

  </button>

</div>


<!-- =========================
     DOUBT BALL
========================= -->

<div
  id="doubtBall"
  onclick="openDoubt()">

  <img
    src="icon-512.png"
    alt="Owl"
  >

</div>


<!-- =========================
     FLASH
========================= -->

<div id="flash"></div>


<script>


/* =================================
   ELEMENTS
================================= */

const owl =
  document.getElementById("owl");

const speech =
  document.getElementById("speech");

const loginCard =
  document.getElementById("loginCard");

const doubtBall =
  document.getElementById("doubtBall");

const flash =
  document.getElementById("flash");


/* =================================
   OWL IMAGES
================================= */

const confusedOwl =
  "./lv_0_20260628102435.png";

const happyOwl =
  "./lv_0_20260628102500.png";

const flyingOwl =
  "./lv_0_20260628102325.png";


/* =================================
   LOGIN MEMORY
================================= */

const loggedIn =
  localStorage.getItem(
    "supertutions_logged_in"
  ) === "true";


/* =================================
   CHANGE OWL
================================= */

function owlImage(image) {

  owl.src = image;

}


/* =================================
   SPEECH
================================= */

function say(text) {

  speech.innerText = text;

  speech.classList.add("show");

}


function hideSpeech() {

  speech.classList.remove("show");

}


/* =================================
   FIRST TIME USER
================================= */

function firstTimeAnimation() {


  /*
     CONFUSED OWL
  */

  owlImage(confusedOwl);

  owl.style.opacity = "1";

  owl.style.left = "50%";

  owl.style.top = "13%";

  owl.style.transform =
    "translateX(-50%) scale(.85)";

  owl.classList.add("confused");


  /*
     Wait and look at user
  */

  setTimeout(() => {

    say("🤔");

  }, 900);


  /*
     Welcome message
  */

  setTimeout(() => {

    owl.classList.remove(
      "confused"
    );

    owlImage(happyOwl);

    say(
      "Welcome to SuperTutions! 🦉"
    );

  }, 1900);


  /*
     Fly down toward login card
  */

  setTimeout(() => {

    hideSpeech();

    owlImage(flyingOwl);

    owl.classList.add(
      "owl-on-card"
    );

  }, 3500);


  /*
     Login card appears
  */

  setTimeout(() => {

    loginCard.classList.add(
      "show"
    );

  }, 3900);


  /*
     Owl settles above card
  */

  setTimeout(() => {

    owlImage(happyOwl);

    owl.classList.add(
      "owl-float"
    );

  }, 4700);

}


/* =================================
   RETURNING USER
================================= */

function returningAnimation() {


  /*
     HAPPY OWL
  */

  owlImage(happyOwl);

  owl.style.opacity = "1";

  owl.style.left = "50%";

  owl.style.top = "18%";

  owl.style.transform =
    "translateX(-50%) scale(.9)";


  /*
     Look at user
  */

  setTimeout(() => {

    say("Welcome back! 🦉");

  }, 800);


  /*
     Fly toward screen
  */

  setTimeout(() => {

    hideSpeech();

    owlImage(flyingOwl);

    owl.classList.add(
      "owl-zoom"
    );

    flash.classList.add(
      "active"
    );

  }, 2400);


  /*
     Become doubt button
  */

  setTimeout(() => {

    owl.style.opacity = "0";

    doubtBall.classList.add(
      "show"
    );

    doubtBall.classList.add(
      "pulse"
    );

  }, 3200);

}


/* =================================
   LOGIN
================================= */

function login() {


  /*
     Remember user
  */

  localStorage.setItem(
    "supertutions_logged_in",
    "true"
  );


  /*
     Hide card
  */

  loginCard.classList.remove(
    "show"
  );


  hideSpeech();


  /*
     OWL LOOKS HAPPY
  */

  owl.classList.remove(
    "owl-on-card"
  );

  owl.classList.remove(
    "owl-float"
  );

  owlImage(happyOwl);


  /*
     ZOOM INTO SCREEN
  */

  setTimeout(() => {

    owl.classList.add(
      "owl-zoom"
    );

    flash.classList.add(
      "active"
    );

  }, 250);


  /*
     Fly away and become button
  */

  setTimeout(() => {

    owl.style.opacity = "0";

    owl.classList.remove(
      "owl-zoom"
    );

    doubtBall.classList.add(
      "show"
    );

    doubtBall.classList.add(
      "pulse"
    );

  }, 1300);

}


/* =================================
   DOUBT BUTTON
================================= */

function openDoubt() {

  /*
     Temporary behavior for now.
     We'll build the actual
     doubt assistant later.
  */

  alert(
    "🦉 Doubt Assistant coming soon!"
  );

}


/* =================================
   START APP
================================= */

if (loggedIn) {

  returningAnimation();

}
else {

  firstTimeAnimation();

}


</script>

</body>
</html>
